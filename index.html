<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarblePi - 彈珠競速與領土戰爭</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 16:9 視窗容器 -->
  <div class="aspect-wrapper">
    <div class="game-container">
      <!-- 頂部控制列 -->
      <header class="top-bar">
        <div class="brand">MarblePi War</div>
        <div class="actions">
          <button id="btn-start" class="btn primary">開始戰爭</button>
          <button id="btn-settings" class="btn secondary">⚙️ 設定</button>
          <button id="btn-export" class="btn danger" disabled>下載 MP4 戰報</button>
        </div>
      </header>

      <!-- 雙畫布主要區域 -->
      <main class="viewport">
        <!-- 左側：風洞柏青哥 -->
        <div class="panel-left">
          <canvas id="pinball-canvas"></canvas>
          <div class="skill-dock">
            <div class="skill-item">風暴</div>
            <div class="skill-item">機槍</div>
            <div class="skill-item">護盾</div>
            <div class="skill-item">大球</div>
            <div class="skill-item">狙擊</div>
          </div>
        </div>

        <!-- 右側：基地領土戰爭 -->
        <div class="panel-right">
          <canvas id="battle-canvas"></canvas>
        </div>
      </main>
    </div>
  </div>

  <!-- 設定彈窗 Modal -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-content">
      <h2>遊戲參數與地圖設定</h2>
      <div class="setting-grid">
        <div class="form-group">
          <label>重力強度</label>
          <input type="range" id="cfg-gravity" min="0.05" max="0.4" step="0.01" value="0.12">
        </div>
        <div class="form-group">
          <label>上升風洞推力</label>
          <input type="range" id="cfg-wind" min="0.1" max="0.8" step="0.02" value="0.32">
        </div>
        <div class="form-group">
          <label>領土網格高精密度 (Pixels)</label>
          <select id="cfg-grid-res">
            <option value="100">100 x 100 (高超清)</option>
            <option value="80" selected>80 x 80 (標準效能)</option>
            <option value="50">50 x 50 (低配流暢)</option>
          </select>
        </div>
        <div class="form-group">
          <label>初始基地護盾</label>
          <input type="number" id="cfg-init-shield" value="10000">
        </div>
        <div class="form-group">
          <label>自動開始錄影 MP4</label>
          <input type="checkbox" id="cfg-auto-record" checked>
        </div>
      </div>
      <div class="modal-actions">
        <button id="btn-save-settings" class="btn primary">儲存並應用</button>
      </div>
    </div>
  </div>

  <!-- 引入模組化 JS 檔案 -->
  <script src="constants.js"></script>
  <script src="pinball.js"></script>
  <script src="battle.js"></script>
  <script src="app.js"></script>
</body>
</html>
